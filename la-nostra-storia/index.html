<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>La nostra storia | Gioielleria Di Nucci</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="contenuto">
    <section class="story-section fade-section" id="storia" aria-labelledby="story-title">
      <div class="story-grid shell-wide">
        <div class="story-gallery reveal-photo reveal-photo--left" role="region" aria-label="Cinque immagini della storia Di Nucci">
          <div class="story-slides">
            <img class="story-slide is-active" src="images/artigianalita.jpg" alt="Lavorazione artigianale di un gioiello" aria-hidden="false">
            <img class="story-slide" src="images/logo-storico.jpg" alt="Logo storico della Gioielleria Di Nucci" aria-hidden="true">
            <img class="story-slide story-slide--contain" src="images/inaugurazione-2018.jpg" alt="Inaugurazione della sede di Corso Cavour nel 2018" aria-hidden="true">
            <img class="story-slide" src="images/negozio-1.png" alt="Dettaglio azzurro degli interni della gioielleria" aria-hidden="true">
            <img class="story-slide" src="images/negozio-2.png" alt="Banco della Gioielleria Di Nucci" aria-hidden="true">
          </div>
          <button class="story-play" id="story-play" type="button" aria-pressed="false" aria-label="Metti in pausa le immagini della storia"><span aria-hidden="true"></span></button>
        </div>

        <div class="story-copy reveal">
          <p class="story-since">Dal dopoguerra</p>
          <div class="story-wordmark">
            <h2 id="story-title">Gioielleria<br>Di Nucci</h2>
            <span aria-hidden="true"></span>
          </div>
          <p class="story-location">Gioielleria a Novara</p>
        </div>
      </div>

      <div class="story-review shell reveal">
        <a class="story-review__link" href="https://www.google.com/search?q=Gioielleria+Di+Nucci+Novara&amp;ludocid=16073850743856445600#lrd=0x47865a1c6914d199:0xdf11ca16b03638a0,3,,," target="_blank" rel="noopener noreferrer" aria-label="Gioielleria Di Nucci: valutazione 5 su 5, 15 recensioni. Lasciaci una recensione su Google">
          <strong class="story-review__rating">5,0</strong>
          <span class="story-review__stars" aria-hidden="true">★★★★★</span>
          <span class="story-review__count">15 recensioni</span>
          <span class="story-review__action">Lasciaci una recensione <i aria-hidden="true">↗</i></span>
        </a>
      </div>
    </section>

    <section class="novara-section cream-section" id="novara" aria-labelledby="novara-title">
      <div class="novara-copy shell-wide reveal">
        <p class="eyebrow">Radici novaresi</p>
        <h2 id="novara-title"><span id="timeline-title-lead">Le origini</span> <em id="timeline-title-emphasis">a Novara</em></h2>
        <span class="heading-ornament" aria-hidden="true"><i></i></span>
      </div>

      <div class="timeline-stage shell-wide">
        <div class="timeline-feature is-description-right">
          <figure class="timeline-visual reveal-photo" id="timeline-visual">
            <div class="timeline-visual__frame"><img id="timeline-image" src="images/logo-storico.jpg" alt="Il logo storico della Gioielleria Di Nucci"></div>
            <figcaption id="timeline-caption">Le origini &middot; Corso Cavour</figcaption>
          </figure>
          <div class="timeline-narrative">
            <p id="timeline-description" aria-live="polite" aria-atomic="true">Nel dopoguerra Pacifico e Giulia diventano un punto di riferimento per l'oreficeria e l'argenteria piemontese, con sede in Corso Cavour 11.</p>
          </div>
        </div>

        <div class="timeline" aria-label="Momenti chiave della storia della Gioielleria Di Nucci">
          <div class="timeline__line" aria-hidden="true"><i></i></div>
          <div class="timeline__steps">
            <button class="timeline-step is-active" type="button" data-timeline-index="0" aria-pressed="true" aria-controls="timeline-description timeline-image novara-title">
              <span class="four-star" aria-hidden="true">
                <img class="four-star__art four-star__art--blue" src="images/stella-quattro-punte-azzurro-finale-web.png" alt="">
                <img class="four-star__art four-star__art--gold" src="images/stella-quattro-punte-oro-finale-web.png" alt="">
              </span>
              <strong>Dopoguerra</strong><small>Le origini</small>
            </button>
            <button class="timeline-step" type="button" data-timeline-index="1" aria-pressed="false" aria-controls="timeline-description timeline-image novara-title">
              <span class="four-star" aria-hidden="true">
                <img class="four-star__art four-star__art--blue" src="images/stella-quattro-punte-azzurro-finale-web.png" alt="">
                <img class="four-star__art four-star__art--gold" src="images/stella-quattro-punte-oro-finale-web.png" alt="">
              </span>
              <strong>Anni '70</strong><small>Il dettaglio</small>
            </button>
            <button class="timeline-step" type="button" data-timeline-index="2" aria-pressed="false" aria-controls="timeline-description timeline-image novara-title">
              <span class="four-star" aria-hidden="true">
                <img class="four-star__art four-star__art--blue" src="images/stella-quattro-punte-azzurro-finale-web.png" alt="">
                <img class="four-star__art four-star__art--gold" src="images/stella-quattro-punte-oro-finale-web.png" alt="">
              </span>
              <strong>2000</strong><small>Terza generazione</small>
            </button>
            <button class="timeline-step" type="button" data-timeline-index="3" aria-pressed="false" aria-controls="timeline-description timeline-image novara-title">
              <span class="four-star" aria-hidden="true">
                <img class="four-star__art four-star__art--blue" src="images/stella-quattro-punte-azzurro-finale-web.png" alt="">
                <img class="four-star__art four-star__art--gold" src="images/stella-quattro-punte-oro-finale-web.png" alt="">
              </span>
              <strong>2018</strong><small>Il ritorno</small>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
